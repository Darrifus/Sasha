<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Пойдёшь со мной на свидание?</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 40%, #ffd6e7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* плавающие сердечки фон */
    .bg-hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-hearts span {
      position: absolute;
      font-size: 24px;
      opacity: 0.18;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(110vh) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.18; }
      90%  { opacity: 0.18; }
      100% { transform: translateY(-10vh) rotate(30deg); opacity: 0; }
    }

    /* карточка */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(16px);
      border-radius: 32px;
      padding: 48px 44px 44px;
      max-width: 420px;
      width: 90vw;
      text-align: center;
      box-shadow: 0 20px 60px rgba(233,30,140,0.18), 0 4px 16px rgba(0,0,0,0.06);
      border: 1.5px solid rgba(255,255,255,0.7);
    }

    .screen { display: none; flex-direction: column; align-items: center; gap: 20px; }
    .screen.active { display: flex; }

    .big-emoji { font-size: 64px; line-height: 1; margin-bottom: 4px; }

    h1 {
      font-family: 'Pacifico', cursive;
      font-size: 26px;
      color: #c2185b;
      line-height: 1.35;
    }

    .sub {
      font-size: 15px;
      color: #ad5278;
      font-weight: 600;
    }

    .hearts-row { font-size: 24px; letter-spacing: 8px; }

    /* кнопки */
    .btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      margin-top: 4px;
    }

    .btn {
      padding: 12px 32px;
      border-radius: 50px;
      border: none;
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-yes {
      background: linear-gradient(135deg, #f06292, #e91e8c);
      color: #fff;
      box-shadow: 0 6px 20px rgba(233,30,140,0.35);
    }

    .btn-no {
      background: #fff0f5;
      color: #c2185b;
      border: 2px solid #f8bbd0;
    }

    .btn-no.escaped {
      position: fixed;
      z-index: 999;
    }

    /* экран успеха */
    #success .big-emoji { animation: bounce 0.6s infinite alternate; }
    @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }

    #cat-img {
      width: 200px;
      height: 200px;
      border-radius: 24px;
      object-fit: cover;
      border: 4px solid #f8bbd0;
      box-shadow: 0 8px 30px rgba(233,30,140,0.2);
    }

    .confetti-row { font-size: 30px; letter-spacing: 6px; animation: wiggle 1s ease-in-out infinite alternate; }
    @keyframes wiggle { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

    h2 {
      font-family: 'Pacifico', cursive;
      font-size: 22px;
      color: #c2185b;
    }
  </style>
</head>
<body>

<!-- фоновые сердечки -->
<div class="bg-hearts" id="bgHearts"></div>

<div class="card">

  <!-- Экран 1: пойдёшь на свидание? -->
  <div class="screen active" id="screen1">
    <div class="big-emoji">🌸</div>
    <h1>Ты пойдёшь со мной на свидание?</h1>
    <p class="sub">Только честно 🥺</p>
    <div class="hearts-row">💕 💕 💕</div>
    <div class="btn-row" id="btnRow1">
      <button class="btn btn-yes" onclick="goTo('screen2')">Да!</button>
      <button class="btn btn-no" id="no1"
        onmouseover="runAway('no1')"
        ontouchstart="runAway('no1')">Нет</button>
    </div>
  </div>

  <!-- Экран 2: ты платишь? -->
  <div class="screen" id="screen2">
    <div class="big-emoji">🎉</div>
    <h1>Ты платишь?</h1>

    <div class="hearts-row">🌟 🌟 🌟</div>
    <div class="btn-row" id="btnRow2">
      <button class="btn btn-yes" onclick="goToSuccess()">Да!</button>
      <button class="btn btn-no" id="no2"
        onmouseover="runAway('no2')"
        ontouchstart="runAway('no2')">Нет</button>
    </div>
  </div>

  <!-- Экран успеха -->
  <div class="screen" id="success">
    <div class="confetti-row">🎊 🎊 🎊</div>
    <div class="big-emoji">🥳</div>
    <h2>Ура! Ты лучший!</h2>
    <img id="cat-img"
      src="https://cataas.com/cat?type=square&width=200&height=200"
      alt="радующийся кот"
      onerror="this.src='https://placecats.com/200/200'" />
    <p class="sub">Кот тоже рад за нас 🐱✨</p>
    <div class="hearts-row">💖 💖 💖</div>
  </div>

</div>

<script>
  // генерируем фоновые сердечки
  const bg = document.getElementById('bgHearts');
  const symbols = ['❤️','💕','💖','💗','🌸','✨','💝'];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement('span');
    s.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.animationDuration = (6 + Math.random() * 10) + 's';
    s.style.animationDelay = (Math.random() * 12) + 's';
    s.style.fontSize = (16 + Math.random() * 20) + 'px';
    bg.appendChild(s);
  }

  // кнопка убегает только после первого наведения
  function runAway(btnId) {
    const btn = document.getElementById(btnId);
    if (!btn.classList.contains('escaped')) {
      const r = btn.getBoundingClientRect();
      btn.style.width = r.width + 'px';
      btn.style.height = r.height + 'px';
      btn.style.left = r.left + 'px';
      btn.style.top = r.top + 'px';
      btn.classList.add('escaped');
    }

    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const bw = btn.offsetWidth + 16;
    const bh = btn.offsetHeight + 16;

    for (let i = 0; i < 20; i++) {
      const nx = 8 + Math.random() * (vw - bw - 8);
      const ny = 8 + Math.random() * (vh - bh - 8);
      const cx = parseFloat(btn.style.left);
      const cy = parseFloat(btn.style.top);
      if (Math.abs(nx - cx) > 80 || Math.abs(ny - cy) > 40) {
        btn.style.left = nx + 'px';
        btn.style.top = ny + 'px';
        break;
      }
    }
  }

  function goTo(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    // сброс кнопки нет обратно в поток при смене экрана
    document.querySelectorAll('.btn-no').forEach(btn => {
      btn.classList.remove('escaped');
      btn.style.left = '';
      btn.style.top = '';
      btn.style.width = '';
      btn.style.height = '';
    });
  }

  function goToSuccess() {
    goTo('success');
  }
</script>
</body>
</html>
